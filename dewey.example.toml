# Copy to dewey.toml (git-ignored) and adjust. Relative paths resolve against this file.
# Precedence: --db / --out argument, then ASI_DEWEY_DB / ASI_DEWEY_WORKBOOK / ASI_DEWEY_OUT, then this file.
# The window theme is not a project setting: it is latched per person in %LOCALAPPDATA%\asi\dewey\prefs.json
# ($ASI_DEWEY_PREFS) by the picker or `asi-dewey theme <key>`; `--theme` / $ASI_DEWEY_THEME are one-off views.
# The family lock (one primary tool at a time, shared with asi_kletz) has no key here either: its
# directory is %LOCALAPPDATA%\asi\locks, or $ASI_PRIMARY_LOCK_DIR, an environment variable both tools
# read so they always agree on it. Never point it inside a repo or a synced folder.
# The automation session (the window's loopback server) is per launch, not per project: its file is
# %LOCALAPPDATA%\asi\dewey\session.json ($ASI_DEWEY_SESSION); ASI_DEWEY_AUTOMATION=off or --no-server turns it off.

# SQLite database: the single source of truth.
db = "dewey.db"

# Excel workbook regenerated by `asi-dewey export excel` and Ctrl+E in the window.
# Point it at a shared folder if the workbook is read by other people.
workbook = "dewey.xlsx"

# Folder for generated diagrams (`asi-dewey diagram`) and documents (`asi-dewey document`):
# PNG/SVG/DOT/Mermaid per diagram, Markdown/PDF/Word per document with figures in out/figures/.
# Default: out/ next to the database.
out = "out"

# JQL that `asi-dewey jira sync` pulls into the Jira Ticket table through asi_hopper (read only).
# asi_hopper itself is configured by its own hopper.toml ($ASI_HOPPER_CONFIG); sign in once with
# `asi-hopper auth login`.
jira_jql = "project = HWL AND (assignee = currentUser() OR watcher = currentUser()) AND statusCategory != Done"

# JQL the JIRA Live Data window and `asi-dewey jira live` fetch (default: every HWL issue, newest
# change first). Distinct from jira_jql, which is what `jira sync` caches into the Jira Ticket table.
jira_live_jql = "project = HWL AND (assignee = currentUser() OR reporter = currentUser() OR watcher = currentUser()) ORDER BY updated DESC"

# Opt in to one fetch when the JIRA Live Data window is first shown in a session. Default false
# (since 0.7.3): the window never connects to Jira on its own and waits for Refresh. Set true to
# have the first show fetch (up to 2000 issues at 50 a page; the window stays live meanwhile).
jira_live_autofetch = false
